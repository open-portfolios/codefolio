# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  SOURCES:
    - yoga
  BUILD_DIR: "{{.TASKFILE_DIR}}/build"
  INSTALL_DIR: "{{.TASKFILE_DIR}}/install"
  WRAPPER_DIR: "{{.TASKFILE_DIR}}/wrapper"
  SWIG_DIR: "{{.TASKFILE_DIR}}/swig"

tasks:
  build:
    desc: Build cpp dependencies
    dir: "{{.TASKFILE_DIR}}"
    preconditions:
      - sh: command -v cmake > /dev/null
        msg: CMake must be installed to build cpp dependencies.
      - sh: command -v ninja > /dev/null
        msg: Ninja must be installed to build cpp dependencies.
    cmds:
      - mkdir {{.BUILD_DIR}}
      - mkdir {{.INSTALL_DIR}}
      - for: { var: SOURCES }
        cmd: cmake -S "src/{{.ITEM}}" -B "{{.BUILD_DIR}}/{{.ITEM}}" -G Ninja -DCMAKE_INSTALL_PREFIX="{{.INSTALL_DIR}}"
      - for: { var: SOURCES }
        cmd: cmake --build "{{.BUILD_DIR}}/{{.ITEM}}" --target install
    silent: true

  wrap:
    desc: Generate Go wrapper for cpp dependencies
    dir: "{{.TASKFILE_DIR}}"
    preconditions:
      - sh: command -v swig > /dev/null
        msg: SWIG must be installed to generate Go wrapper from cpp dependencies
    cmds:
      - for: { var: SOURCES }
        cmd: mkdir -p "{{.WRAPPER_DIR}}/{{.ITEM}}"
      - for: { var: SOURCES }
        cmd: >-
          swig -go                                    \
            -I"{{.INSTALL_DIR}}/include"              \
            -outdir "{{.WRAPPER_DIR}}/{{.ITEM}}"      \
            -o "{{.WRAPPER_DIR}}/{{.ITEM}}/wrapper.c" \
          "{{.SWIG_DIR}}/{{.ITEM}}.swig"
    silent: true
