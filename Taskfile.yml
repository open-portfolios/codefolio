# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  CLI_PROJECT_ROOT: "{{.TASKFILE_DIR}}/cmd/cli"
  APP_PROJECT_ROOT: "{{.TASKFILE_DIR}}/cmd/app"
  BUILD_DIR: "{{.TASKFILE_DIR}}/build"

tasks:
  update-devtools:
    desc: Install latest essential devtools for CLI and App.
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - go install github.com/google/wire/cmd/wire@latest
      - go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - go install github.com/cylixlee/tux/cmd/tux@latest
    silent: true

  check:
    desc: Check the project for errors
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - install-cli-devtools
      - install-app-devtools
    cmds:
      - tux ./...
      - wire ./...
      - go fix ./...
      - go fmt ./...
      - go build ./...
      - go test ./...
      - go vet ./...
      - cd cmd/app/web && pnpm build
      - cd cmd/app/web && pnpm lint
    silent: true
    interactive: true

  cli:
    desc: Run codefolio CLI
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - install-cli-devtools
    cmds:
      - tux ./...
      - wire ./...
      - go run {{.CLI_PROJECT_ROOT}}
    silent: true
    interactive: true

  app:
    desc: Run Codefolio App
    dir: "{{.APP_PROJECT_ROOT}}"
    deps:
      - install-app-devtools
    cmds:
      - wire ./...
      - wails dev
      - rm -rf build/bin
    silent: true
    interactive: true

  clean:
    desc: Clean build artifacts
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - rm -rf {{.BUILD_DIR}}
    silent: true

  build:
    desc: Build CLI and App for release
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - install-cli-devtools
      - install-app-devtools
    cmds:
      - task: clean
      - mkdir -p {{.BUILD_DIR}}
      - echo "*" > {{.BUILD_DIR}}/.gitignore
      - cp -r .codefolio {{.BUILD_DIR}}/
      - cmd: cp .env {{.BUILD_DIR}}/
        if: test -f .env
      - task: build-app
      - task: build-cli
    silent: true

  build-cli:
    internal: true
    dir: "{{.TASKFILE_DIR}}"
    deps:
      - install-cli-devtools
    vars:
      EXT:
        sh: if [ "{{OS}}" = "windows" ]; then echo -n ".exe"; fi
    cmds:
      - go build -o {{.BUILD_DIR}}/codefolio{{.EXT}} {{.CLI_PROJECT_ROOT}}
    silent: true

  build-app:
    internal: true
    dir: "{{.APP_PROJECT_ROOT}}"
    deps:
      - install-app-devtools
    cmds:
      - wails build > /dev/null
      - mv build/bin/* {{.BUILD_DIR}}/
      - rm -rf build/bin
    silent: true

  install-common-devtools:
    internal: true
    cmds:
      - cmd: go install github.com/google/wire/cmd/wire@latest
        if: "! command -v wire > /dev/null"
    silent: true

  install-cli-devtools:
    internal: true
    deps:
      - install-common-devtools
    cmds:
      - cmd: go install github.com/cylixlee/tux/cmd/tux@latest
        if: "! command -v tux > /dev/null"
    silent: true

  install-app-devtools:
    internal: true
    deps:
      - install-common-devtools
    cmds:
      - cmd: go install github.com/wailsapp/wails/v2/cmd/wails@latest
        if: "! command -v wails > /dev/null"
    silent: true
