# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  CLI_PROJECT_ROOT: "{{.TASKFILE_DIR}}/cmd/cli"
  APP_PROJECT_ROOT: "{{.TASKFILE_DIR}}/cmd/app"
  BUILD_DIR: "{{.TASKFILE_DIR}}/build"

tasks:
  install:
    desc: Install Go toolchains for CLI and App (Node.js/pnpm excluded)
    cmds:
      - task: install-cli-toolchain
      - task: install-app-toolchain

  cli:
    desc: Run codefolio CLI
    deps:
      - install-cli-toolchain
    cmds:
      - tui generate ./...
      - go run {{.CLI_PROJECT_ROOT}}
    silent: true
    interactive: true

  app:
    desc: Run Codefolio App
    dir: "{{.APP_PROJECT_ROOT}}"
    deps:
      - install-app-toolchain
    cmds:
      - wails dev
      - rm -rf build/bin
    silent: true
    interactive: true

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
    silent: true

  build:
    desc: Build CLI and App for release
    cmds:
      - task: clean
      - mkdir -p {{.BUILD_DIR}}
      - echo "*" > {{.BUILD_DIR}}/.gitignore
      - cp -r .codefolio {{.BUILD_DIR}}/
      - cmd: cp .env {{.BUILD_DIR}}/
        if: test -f .env
      - task: build-app
      - task: build-cli
    silent: true

  install-cli-toolchain:
    internal: true
    cmds:
      - cmd: go install github.com/grindlemire/go-tui/cmd/tui@latest
        if: "! command -v tui > /dev/null"
    silent: true

  install-app-toolchain:
    internal: true
    cmds:
      - cmd: go install github.com/wailsapp/wails/v2/cmd/wails@latest
        if: "! command -v wails > /dev/null"
    silent: true

  build-cli:
    internal: true
    deps:
      - install-cli-toolchain
    vars:
      EXT:
        sh: if [ "{{OS}}" = "windows" ]; then echo -n ".exe"; fi
    cmds:
      - tui generate ./...
      - go build -o {{.BUILD_DIR}}/codefolio{{.EXT}} {{.CLI_PROJECT_ROOT}}
    silent: true

  build-app:
    internal: true
    dir: "{{.APP_PROJECT_ROOT}}"
    deps:
      - install-app-toolchain
    cmds:
      - wails build > /dev/null
      - mv build/bin/* {{.BUILD_DIR}}/
      - rm -rf build/bin
    silent: true
